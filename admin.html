<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CASH LOAN | Demo Admin</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#eef4ff,#f8f5ff);
    color:#172033;
}

.demo{
    background:#fff0c2;
    color:#6b4e00;
    text-align:center;
    padding:9px;
    font-size:13px;
    font-weight:bold;
}

.login-box{
    width:90%;
    max-width:420px;
    margin:80px auto;
    background:white;
    padding:35px;
    border-radius:22px;
    box-shadow:0 20px 60px rgba(30,50,100,.12);
    text-align:center;
}

.logo{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin-bottom:25px;
}

.logo-mark{
    width:45px;
    height:45px;
    border-radius:14px;
    background:linear-gradient(135deg,#173b8f,#7657ff);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:23px;
    font-weight:bold;
}

.logo-name{
    font-size:25px;
    font-weight:bold;
    color:#173b8f;
}

.login-box h1{
    margin-bottom:10px;
}

.subtitle{
    color:#64748b;
    font-size:14px;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #dbe2ef;
    border-radius:10px;
    font-size:15px;
    outline:none;
}

button{
    border:none;
    border-radius:10px;
    padding:12px 18px;
    font-weight:bold;
    cursor:pointer;
}

.login-button{
    width:100%;
    margin-top:15px;
    background:linear-gradient(135deg,#173b8f,#7657ff);
    color:white;
    font-size:15px;
}

.error{
    color:#dc2626;
    font-size:14px;
    margin-top:12px;
    display:none;
}

#adminPanel{
    display:none;
}

header{
    background:white;
    padding:18px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #e5e7eb;
}

.header-logo{
    font-size:24px;
    font-weight:bold;
    color:#173b8f;
}

.logout{
    background:#fee2e2;
    color:#b91c1c;
}

.container{
    max-width:1100px;
    margin:40px auto;
    padding:0 20px;
}

.welcome{
    margin-bottom:25px;
}

.welcome h1{
    font-size:32px;
    margin-bottom:7px;
}

.welcome p{
    color:#64748b;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-bottom:25px;
}

.stat{
    background:white;
    padding:25px;
    border-radius:18px;
    border:1px solid #e5e7eb;
}

.stat h3{
    color:#173b8f;
    margin-bottom:10px;
}

.number{
    font-size:30px;
    font-weight:bold;
}

.application{
    background:white;
    padding:28px;
    border-radius:20px;
    border:1px solid #e5e7eb;
    box-shadow:0 8px 25px rgba(30,50,100,.06);
}

.application-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:25px;
}

.status{
    padding:8px 15px;
    border-radius:30px;
    background:#fef3c7;
    color:#92400e;
    font-weight:bold;
}

.status.approved{
    background:#dcfce7;
    color:#166534;
}

.details{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.detail{
    background:#f8fafc;
    padding:15px;
    border-radius:10px;
}

.detail strong{
    display:block;
    color:#64748b;
    font-size:13px;
    margin-bottom:5px;
}

.action{
    margin-top:25px;
    padding-top:25px;
    border-top:1px solid #e5e7eb;
}

.approve{
    background:#16a34a;
    color:white;
}

.approved-message{
    display:none;
    background:#dcfce7;
    color:#166534;
    padding:15px;
    border-radius:10px;
}

.no-application{
    background:white;
    padding:30px;
    border-radius:18px;
    text-align:center;
    color:#64748b;
}

.demo-note{
    margin-top:25px;
    background:#eef3ff;
    padding:18px;
    border-radius:12px;
    color:#334155;
}

@media(max-width:700px){

    header{
        padding:15px 20px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .details{
        grid-template-columns:1fr;
    }

    .application-header{
        flex-direction:column;
        align-items:flex-start;
    }
}
</style>
</head>

<body>

<div class="demo">
DEMO — Fictional administrator interface. No real financial service is provided.
</div>


<!-- ADMIN LOGIN -->

<div id="loginScreen">

<div class="login-box">

<div class="logo">

<div class="logo-mark">
C
</div>

<div class="logo-name">
CASH LOAN
</div>

</div>

<h1>
Admin Login
</h1>

<p class="subtitle">
Private demonstration administrator access.
</p>

<input
type="password"
id="adminPassword"
placeholder="Enter admin password">

<button
class="login-button"
onclick="login()">

Login

</button>

<p
id="loginError"
class="error">

Incorrect password.

</p>

</div>

</div>


<!-- ADMIN PANEL -->

<div id="adminPanel">

<header>

<div class="header-logo">
CASH LOAN Admin
</div>

<button
class="logout"
onclick="logout()">

Logout

</button>

</header>


<div class="container">

<div class="welcome">

<h1>
Admin Dashboard
</h1>

<p>
Review the LOAN application FORM
 website.
</p>

</div>


<div class="stats">

<div class="stat">

<h3>
Applications
</h3>

<div
class="number"
id="totalApplications">

0

</div>

</div>


<div class="stat">

<h3>
Pending
</h3>

<div
class="number"
id="pendingApplications">

0

</div>

</div>


<div class="stat">

<h3>
Approved
</h3>

<div
class="number"
id="approvedApplications">

0

</div>

</div>

</div>


<div id="applicationArea">
</div>


<div class="-note">

</p>

</div>

</div>

</div>


<script>

/*
IMPORTANT:

Use the same password you chose previously.

Change this value if you changed your admin password.
*/

const ADMIN_PASSWORD = "CASHLOAN";


function login(){

    const password =
        document.getElementById(
            "adminPassword"
        ).value;


    if(password === ADMIN_PASSWORD){

        sessionStorage.setItem(
            "demoAdminLoggedIn",
            "true"
        );

        document.getElementById(
            "loginScreen"
        ).style.display = "none";

        document.getElementById(
            "adminPanel"
        ).style.display = "block";

        loadAdmin();

    }else{

        document.getElementById(
            "loginError"
        ).style.display = "block";

    }

}


/* LOAD ADMIN DATA */

function loadAdmin(){

    const saved =
        localStorage.getItem(
            "lendoraApplication"
        );


    if(!saved){

        document.getElementById(
            "totalApplications"
        ).textContent = "0";

        document.getElementById(
            "pendingApplications"
        ).textContent = "0";

        document.getElementById(
            "approvedApplications"
        ).textContent = "0";


        document.getElementById(
            "applicationArea"
        ).innerHTML = `

            <div class="no-application">

                <h2>No Demo Applications Yet</h2>

                <p style="margin-top:8px;">

                Submit an application through
                the demo Apply page first.

                </p>

            </div>

        `;

        return;

    }


    const application =
        JSON.parse(saved);


    const status =
        application.status || "PENDING";


    document.getElementById(
        "totalApplications"
    ).textContent = "1";


    document.getElementById(
        "pendingApplications"
    ).textContent =
        status === "PENDING" ? "1" : "0";


    document.getElementById(
        "approvedApplications"
    ).textContent =
        status === "APPROVED" ? "1" : "0";


    const statusClass =
        status === "APPROVED"
        ? "status approved"
        : "status";


    let actionHTML = "";


    if(status === "PENDING"){

        actionHTML = `

            <div class="action">

                <button
                class="approve"
                onclick="approveApplication()">

                Approve Demo Application

                </button>

            </div>

        `;

    }else{

        actionHTML = `

            <div class="action">

                <div class="approved-message"
                style="display:block;">

                ✓ Demo application approved.

                </div>

            </div>

        `;

    }


    document.getElementById(
        "applicationArea"
    ).innerHTML = `

        <div class="application">

            <div class="application-header">

                <div>

                    <h2>
                    ${escapeHTML(application.fullName)}
                    </h2>

                    <p
                    style="margin-top:6px;color:#64748b;">

                    Reference:
                    ${escapeHTML(application.reference)}

                    </p>

                </div>


                <div class="${statusClass}">

                ${status}

                </div>

            </div>


            <div class="details">


                <div class="detail">

                    <strong>Username</strong>

                    ${escapeHTML(application.username)}

                </div>


                <div class="detail">

                    <strong>Phone</strong>

                    ${escapeHTML(application.phone)}

                </div>


                <div class="detail">

                    <strong>Country</strong>

                    ${escapeHTML(application.country)}

                </div>


                <div class="detail">

                    <strong>State</strong>

                    ${escapeHTML(application.state)}

                </div>


                <div class="detail">

                    <strong>Occupation</strong>

                    ${escapeHTML(application.occupation)}

                </div>


                <div class="detail">

                    <strong>Monthly Income</strong>

                    ${escapeHTML(String(application.income))}

                </div>


                <div class="detail">

                    <strong>Currency</strong>

                    ${escapeHTML(application.currency)}

                </div>


                <div class="detail">

                    <strong>Requested Amount</strong>

                    ${formatMoney(
                        application.amount,
                        application.currency
                    )}

                </div>


                <div class="detail">

                    <strong>Loan Duration</strong>

                    ${application.duration} months

                </div>


                <div class="detail">

                    <strong>Marital Status</strong>

                    ${escapeHTML(application.maritalStatus)}

                </div>


                <div class="detail"
                style="grid-column:1/-1;">

                    <strong>Loan Purpose</strong>

                    ${escapeHTML(application.purpose)}

                </div>


                <div class="detail"
                style="grid-column:1/-1;">

                    <strong>Address</strong>

                    ${escapeHTML(application.address)}

                </div>

            </div>


            ${actionHTML}

        </div>

    `;

}


/* APPROVE APPLICATION */

function approveApplication(){

    const saved =
        localStorage.getItem(
            "lendoraApplication"
        );


    if(!saved){

        return;

    }


    const application =
        JSON.parse(saved);


    application.status =
        "APPROVED";


    /*
    The dashboard will calculate the
    simulated 2% registration fee
    from the actual requested amount.
    */

    application.registrationFee =
        Number(application.amount) * 0.02;


    localStorage.setItem(
        "Cash loan Application",
        JSON.stringify(application)
    );


    loadAdmin();


    alert(
        "application approved successfully."
    );

}


/* MONEY */

function formatMoney(amount,currency){

    try{

        return new Intl.NumberFormat(
            undefined,
            {
                style:"currency",
                currency:currency,
                maximumFractionDigits:2
            }
        ).format(amount);

    }catch(error){

        return currency + " " +
        Number(amount).toLocaleString();

    }

}


/* SECURITY FOR DISPLAY */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* LOGOUT */

function logout(){

    sessionStorage.removeItem(
        "AdminLoggedIn"
    );

    location.reload();

}


/* RESTORE ADMIN SESSION */

window.addEventListener(
    "load",
    function(){

        if(
            sessionStorage.getItem(
                "AdminLoggedIn"
            ) === "true"
        ){

            document.getElementById(
                "loginScreen"
            ).style.display = "none";

            document.getElementById(
                "adminPanel"
            ).style.display = "block";

            loadAdmin();

        }

    }
);

</script>

</body>
</html>
